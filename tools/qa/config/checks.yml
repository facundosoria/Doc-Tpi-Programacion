# La politica del gate. Toda decision de que corre, sobre que, y si frena o no
# se toma aca. Los scripts no deciden nada.
#
# Niveles:
#   bloquea  el hallazgo hace fallar la corrida
#   avisa    se reporta y la corrida sigue
#   arregla  solo formato: corrige en el working tree en vez de protestar
#   off      no se ejecuta
#
# REGLA DE OPERACION: ninguna regla nace en `bloquea`. Nace en `avisa`.
# Se la sube recien cuando demostro que encuentra cosas reales.

perfiles:
  rapido:
    presupuesto_s: 120
    descripcion: "./qa.sh en tu maquina, sobre lo que cambiaste"
  completo:
    presupuesto_s: 600
    descripcion: "lo que corre el CI, sobre todo el repo"

# En CI no hay working tree que sobreviva: el runner clona, corre y descarta. Un
# chequeo en `arregla` ahi corrige archivos que nadie va a ver y deja la corrida
# en verde sin que el arreglo llegue nunca a la rama. Es el peor de los dos
# mundos: no protesta y no arregla.
#
# La degradacion es del entorno, no del chequeo: vale para cualquier nivel que
# escriba. Por eso vive aca y no repartida en cada entrada.
degradacion_ci:
  arregla: bloquea

chequeos:

  ortografia:
    herramienta: cspell
    aplica_a: ["**/*.md"]
    rapido: bloquea
    completo: bloquea

  markdownlint:
    herramienta: markdownlint-cli2
    aplica_a: ["**/*.md"]
    # En `avisa` en los dos perfiles, aplicando la regla de operacion: es un
    # chequeo nuevo y todavia no demostro nada. Sobre el corpus actual da ~170
    # hallazgos de higiene de formato (MD012, MD022, MD032, MD040), todos
    # auto-corregibles. Cuando se limpien, subilo a `bloquea` en completo.
    rapido: avisa
    completo: avisa

  links:
    herramienta: lychee
    # Sin `solo_regresiones`: corre sobre todo el markdown propio y reporta lo que
    # encuentra, tambien lo viejo. La clave estaba puesta y no la leia nadie, que
    # es peor que no tenerla: decia que hacia algo que no hacia.
    rapido: avisa
    completo: bloquea

  referencias:
    herramienta: check_refs
    # Corre sobre el repo entero --un ancla se rompe entre archivos-- pero pasa por
    # diff_gate.py: se ejecuta en HEAD y en la base, y solo bloquea lo que ESTE
    # cambio rompio. La deuda vieja queda informativa. Es lo que la clave
    # `solo_regresiones` decia, y ahora lo dice donde efectivamente ocurre.
    rapido: bloquea
    completo: bloquea

  workflows:
    herramienta: check_workflows
    # Bloquea desde el dia uno, sin periodo de prueba: no hay margen de duda
    # sobre si un hallazgo es real, y el costo de dejarlo pasar es que el equipo
    # entero se quede sin CI a mitad de mes.
    rapido: bloquea
    completo: bloquea
    #
    # EL DIA DE LA MUDANZA AL MONOREPO, ESTA ENTRADA PASA A `off`.
    #
    # La etapa revisa solo los workflows que matchean owned-paths.txt, y ahi
    # figura `.github/workflows/qa.yml` por nombre. En el monorepo ese archivo no
    # se muda --se usa el CI de la catedra-- asi que a la etapa no le queda
    # ningun archivo que revisar y pasaria en verde sin haber mirado nada. Un
    # tilde que no verifico nada es peor que no tener la etapa, porque no se nota
    # en el resumen.
    #
    # Dejarla en `off` con este comentario dice la verdad: no verifica nada, y
    # se sabe por que. La alternativa --apuntar owned-paths.txt al workflow de la
    # catedra-- solo vale si ademas nos dejan arreglar lo que encuentre; si no,
    # es reportar sobre un archivo que no podemos tocar.
    #
    # El riesgo que cubria no desaparece: un workflow que pide una maquina de
    # GitHub sigue quemando los minutos de la cuenta compartida. Lo que cambia es
    # que pasa a ser decision de la catedra y no nuestra.

  secretos:
    herramienta: gitleaks
    rapido: bloquea
    completo: bloquea

  formato:
    herramienta: spotless
    aplica_a: ["**/*.java"]
    rapido: arregla
    completo: bloquea

  compila:
    herramienta: maven-compile
    aplica_a: ["**/*.java"]
    rapido: bloquea
    completo: bloquea

  tests:
    herramienta: maven-test
    aplica_a: ["**/*.java"]
    rapido: bloquea
    completo: bloquea
    solo:
      rapido: unitarios
      completo: todos

  duplicacion:
    herramienta: cpd
    aplica_a: ["**/*.java"]
    # Copiar-pegar. Es lo que mide SonarQube, sin SonarQube: CPD viene con PMD.
    rapido: avisa
    completo: avisa

  cobertura:
    herramienta: diff-cover
    aplica_a: ["**/*.java"]
    # Cobertura de las LINEAS QUE AGREGASTE, no del proyecto. Un umbral global
    # es inaplicable con 11 equipos y genera deuda retroactiva que nadie paga.
    # El minimo se ajusta con QA_COBERTURA_MINIMA (default 70).
    rapido: avisa
    completo: avisa

  analisis_estatico:
    herramienta: pmd
    aplica_a: ["**/*.java"]
    rapido: avisa
    completo: avisa

  idioma_codigo:
    herramienta: cspell-code
    aplica_a: ["**/*.java"]
    rapido: avisa
    completo: avisa
