# Registro de identificadores validos.
#
# RF-IA-* y PAR-* vienen del PRD, que no se versiona en este repo (esta en
# .gitignore). Sin este registro no habria forma de detectar un RF-IA-99 mal
# tipeado. Se sembro con los IDs efectivamente usados en la documentacion.
#
# Los ADR-* NO van aca: se validan directamente contra los headings
# "### ADR-0NN" de docs/08-decisiones-y-pendientes.md, que si esta en el repo.
#
# Cuando el PRD incorpore un requisito nuevo, agregalo a la lista que corresponda.

