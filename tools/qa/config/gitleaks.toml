# Deteccion de secretos.
# Extiende las reglas por defecto de gitleaks (que son buenas) y solo agrega las
# rutas que no tiene sentido escanear: build, dependencias y salida del gate.

[extend]
useDefault = true

[allowlist]
description = "Rutas generadas y fixtures del self-test"
paths = [
  '''\.git/''',
  '''target/''',
  '''node_modules/''',
  '''\.qa/''',
  # El fixture de secretos contiene un token sintetico a proposito. gitleaks
  # escanea el arbol entero y no conoce owned-paths.txt, asi que la exclusion
  # tiene que estar aca.
  #
  # La allowlist aplica siempre, incluso apuntandole directo al archivo. Por eso
  # el self-test copia el fixture a un directorio temporal fuera de esta ruta:
  # de otro modo la propia exclusion taparia el chequeo y quedaria en verde
  # sin haber verificado nada.
  '''tools/qa/tests/fixtures/''',
]
