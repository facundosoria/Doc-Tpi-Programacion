# El diagnostico. Por cada regla conocida: que paso en castellano y como se arregla.
# Es data, no codigo: agregar una regla es agregar una entrada.
#
# Las reglas sin entrada aca caen a un mensaje generico con el codigo crudo de la
# herramienta. Eso esta bien para lo raro, pero lo frecuente deberia estar mapeado.

spotless:
  que_paso: "El formato no coincide con el del proyecto"
  arreglo: "Corre ./qa.sh --only formato y commitea los archivos que quedan modificados"

cspell-unknown-word:
  que_paso: "Palabra que no esta en el diccionario"
  arreglo: "Corregila. Si es un termino del dominio, agregala a tools/qa/config/proyecto/project-words.txt"

cspell-code-non-english:
  que_paso: "Identificador o comentario que no parece estar en ingles"
  arreglo: "El codigo va en ingles. Renombralo, o agrega el termino al diccionario si es un nombre propio"

non-ascii-source:
  que_paso: "Caracter no-ASCII en un archivo fuente"
  arreglo: "El codigo va en ingles y sin acentos. Reescribi el identificador o el comentario"

markdownlint:
  que_paso: "El Markdown no cumple una regla de formato"
  arreglo: "Ver la regla en https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"

lychee-404:
  que_paso: "El archivo o ancla destino no existe"
  arreglo: "Revisa la ruta. Si el destino se renombro, actualiza el link"

ref-desconocida:
  que_paso: "Referencia a un requisito que no esta en el registro"
  arreglo: "Revisa el numero. Si el requisito es nuevo, agregalo a tools/qa/config/proyecto/refs-registry.yml"

ancla-rota:
  que_paso: "El documento destino no tiene esa seccion"
  arreglo: "Revisa el titulo de la seccion en el documento destino: si se renombro, el ancla cambio"

documento-huerfano:
  que_paso: "Documento que no esta linkeado desde ningun otro"
  arreglo: "Agrega el link en el README o en el documento que corresponda, o borra el archivo"

gitleaks:
  que_paso: "Algo con forma de credencial en el codigo"
  arreglo: "Sacalo del repo y rotalo. Si es un ejemplo, usa un valor obviamente falso"

compilation-error:
  que_paso: "El codigo no compila"
  arreglo: "Lee el error del compilador: dice la linea y el simbolo"

assertion-failed:
  que_paso: "Un test esperaba un valor y recibio otro"
  arreglo: "Si el valor nuevo es el correcto, actualiza el test. Si no, revisa el cambio que lo rompio"

pmd-UnusedLocalVariable:
  que_paso: "Variable asignada y nunca leida"
  arreglo: "Borrala"

pmd-UnusedPrivateMethod:
  que_paso: "Metodo privado que nadie llama"
  arreglo: "Borralo. Si va a usarse, todavia no hace falta que exista"

pmd-UnusedImports:
  que_paso: "Import que no se usa"
  arreglo: "Borralo, o corre ./qa.sh --only formato"

pmd-EmptyCatchBlock:
  que_paso: "Excepcion capturada y descartada en silencio"
  arreglo: "Logueala o volve a lanzarla. Un catch vacio esconde fallas reales"

gitleaks-ajeno:
  que_paso: "Credencial en un archivo que NO es nuestro"
  arreglo: "No bloquea porque no esta en owned-paths.txt y no nos toca arreglarlo. Avisale a quien sea dueno de ese archivo: la credencial hay que rotarla, no solo borrarla"

prefijo-inexistente:
  que_paso: "El prefijo del equipo apunta a una carpeta que no existe"
  arreglo: "Corregi tools/qa/config/proyecto/prefijo.txt (o QA_PREFIJO). Con un prefijo mal puesto ningun glob matchea y la corrida pasaria en verde sin mirar nada"

runner-hospedado:
  que_paso: "El workflow pide una maquina de GitHub y eso consume minutos"
  arreglo: "Cambia runs-on por `self-hosted`. El equipo corre todo en su propio runner, que es gratis e ilimitado"

cpd-duplicado:
  que_paso: "Un bloque de codigo aparece repetido en mas de un lugar"
  arreglo: "Extraelo a un metodo o clase comun. Si la repeticion es deliberada, dejala y bajamos la sensibilidad de CPD"

cobertura-insuficiente:
  que_paso: "Las lineas que agregaste no tienen suficientes tests"
  arreglo: "Escribi tests para lo nuevo. El detalle linea por linea queda en .qa/cobertura.md"

pmd-CyclomaticComplexity:
  que_paso: "El metodo tiene demasiados caminos posibles"
  arreglo: "Partilo. Un metodo con 12 ramas es imposible de testear completo y de leer de una"

pmd-CognitiveComplexity:
  que_paso: "El metodo es dificil de seguir mentalmente"
  arreglo: "Aplana los anidamientos. La complejidad cognitiva castiga los if adentro de if, no la cantidad de ramas"

pmd-NPathComplexity:
  que_paso: "La cantidad de caminos de ejecucion se disparo"
  arreglo: "Partilo, o extrae las condiciones a metodos con nombre"

pmd-ExcessiveParameterList:
  que_paso: "El metodo recibe demasiados parametros"
  arreglo: "Agrupalos en un objeto. Siete parametros sueltos se pasan mal en el orden equivocado tarde o temprano"
