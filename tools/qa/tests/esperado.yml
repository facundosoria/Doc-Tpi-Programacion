# Que tiene que encontrar el gate en cada fixture.
#
# La afirmacion es EXACTA: el fixture dispara esa regla y ninguna otra. Eso caza
# las dos fallas que matan a un gate:
#
#   falso negativo  la regla dejo de andar y nadie se entero (el chequeo queda
#                   en verde diciendo "no encontre nada", que es lo peor que
#                   puede pasar)
#   falso positivo  otra regla se activo de mas, el gate se vuelve ruido y a las
#                   tres semanas lo desactivan
#
# REGLA: un chequeo nuevo no se agrega sin su fixture aca.

casos:

  - fixture: limpio.md
    etapa: ortografia
    reglas: []
    # Cero hallazgos: caza falsos positivos, o sea reglas que se volvieron ruidosas.
    #
    # OJO con su limitacion, verificada rompiendo el adaptador a proposito: este
    # caso pasa igual cuando la herramienta esta completamente muerta, porque
    # "no encontro nada" y "no miro nada" se ven iguales desde aca. Los que
    # detectan eso son los fixtures que SI esperan un hallazgo.

  - fixture: typo.md
    etapa: ortografia
    reglas: [cspell-unknown-word]

  - fixture: link-roto.md
    etapa: links
    reglas: [lychee-404]

  - fixture: ref-colgada.md
    etapa: referencias
    reglas: [ref-desconocida]

  - fixture: ancla-rota.md
    etapa: referencias
    reglas: [ancla-rota]

  - fixture: secreto.txt
    etapa: secretos
    reglas: [gitleaks]

  - fixture: workflows
    etapa: workflows
    reglas: [runner-hospedado]
    # El fixture tiene DOS jobs: uno con ubuntu-latest y otro con self-hosted.
    # Que salte una sola regla prueba las dos mitades: caza el que gasta minutos
    # y no molesta con el que corre en el server del equipo.

  - fixture: MalFormateado.java.txt
    etapa: formato
    destino: main
    reglas: [spotless]

  - fixture: NoCompila.java.txt
    etapa: compila
    destino: main
    reglas: [compilation-error]

  - fixture: VariableSinUsar.java.txt
    etapa: analisis_estatico
    destino: main
    reglas: [pmd-UnusedLocalVariable]

  - fixture: MetodoComplejo.java.txt
    etapa: analisis_estatico
    destino: main
    # Las tres reglas tienen razon sobre el mismo metodo y miden cosas distintas:
    # cuantas ramas tiene, cuanto cuesta seguirlo mentalmente, y cuantos caminos
    # de ejecucion genera. Que salten las tres es el comportamiento correcto.
    reglas: [pmd-CognitiveComplexity, pmd-CyclomaticComplexity, pmd-NPathComplexity]

  - fixture: duplicado
    etapa: duplicacion
    destino: main
    reglas: [cpd-duplicado]
    # Fixture de dos archivos: la duplicacion necesita algo que duplicar.

  - fixture: SinCobertura.java.txt
    etapa: cobertura
    destino: main
    reglas: [cobertura-insuficiente]
    # Codigo nuevo sin un solo test. Prueba la cadena entera: JaCoCo produce el
    # reporte, diff-cover lo cruza con el diff de git, y el adaptador lo traduce.

  - fixture: IdentificadorEnEspanol.java.txt
    etapa: idioma_codigo
    destino: main
    reglas: [cspell-code-non-english]

  - fixture: TestQueFalla.java.txt
    etapa: tests
    destino: test
    reglas: [assertion-failed]

  # No es un fixture sino una situacion: un companero commiteo codigo mal
  # formateado y vos tenes otro archivo sin commitear. `spotless:apply` tiene que
  # tocar el tuyo y NO el suyo.
  #
  # Sin esto, el chequeo que cubre `formato` es el de nivel `bloquea`, que corre
  # `spotless:check` y no escribe nada: la rama que ESCRIBE quedaba sin probar. Y
  # es la unica del gate que modifica archivos, o sea la unica que puede meterte
  # en el historial lineas que no escribiste.
  #
  # Corre en un repositorio temporal --hace falta un commit de por medio para que
  # exista la distincion-- y con Maven espiado en vez de ejecutado: lo que se
  # afirma es sobre que archivos se le pidio trabajar, no que spotless formatee
  # bien, que ya lo prueba MalFormateado.java.txt.
  - fixture: atribucion (apply decide por autoria)
    etapa: formato
    por_autoria: true
    reglas: []

