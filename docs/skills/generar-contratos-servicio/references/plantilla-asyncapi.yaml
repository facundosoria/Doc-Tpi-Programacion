# Esqueleto AsyncAPI 3.0 — un canal por evento, address = <evento>.v<major>.
# Envelope común; la correlación (traceparent, X-Request-Id) viaja en HEADERS, no en el payload.
asyncapi: 3.0.0
info:
  title: <N> Service Kafka Events
  version: 1.0.0
  description: Eventos asíncronos de <n>-service. La correlación viaja en headers traceparent y X-Request-Id.
servers:
  platformKafka:
    host: kafka:9092
    protocol: kafka
channels:
  <evento_que_publica>.v1:
    address: <evento_que_publica>.v1
    messages:
      <evento>: { $ref: '#/components/messages/<Evento>' }
  <evento_que_consume>.v1:
    address: <evento_que_consume>.v1
    messages:
      <evento>: { $ref: '#/components/messages/<EventoEntrante>' }
operations:
  publish<Evento>:   { action: send,    channel: { $ref: '#/channels/<evento_que_publica>.v1' } }
  consume<Evento>:   { action: receive, channel: { $ref: '#/channels/<evento_que_consume>.v1' } }
components:
  messages:
    <Evento>:        { payload: { $ref: '#/components/schemas/<Payload>' } }
    <EventoEntrante>: { payload: { $ref: '#/components/schemas/<PayloadEntrante>' } }
  schemas:
    Envelope:
      type: object
      required: [eventId, version, occurredAt, producer, data]
      properties:
        eventId:    { type: string, format: uuid }        # idempotencia: reprocesar no duplica
        version:    { type: string, const: '1.0' }
        occurredAt: { type: string, format: date-time }
        producer:   { type: string }
        data:       { type: object }
    <Payload>:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [ <campos obligatorios del evento> ]
              properties: {}
    <PayloadEntrante>:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { type: object }
