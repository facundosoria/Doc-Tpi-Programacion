spring.application.name=demoLLMSpringAi

# ============================================================
# GOOGLE GEMINI (AI Studio) - Compatible con protocolo OpenAI
# ============================================================
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.model=${GEMINI_MODEL:gemini-flash-lite-latest}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1500

# ============================================================
# BASE DE DATOS (Supabase PostgreSQL / pgvector con fallback a H2)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Modelo de Embeddings (Google AI Studio - 768 dimensiones)
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Server
# ============================================================
server.port=8080
