spring.application.name=demoLLMSpringAi

# ============================================================
# GOOGLE GEMINI (AI Studio) - Compatible con protocolo OpenAI
# ============================================================
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY:AIzaSyCnn3urBRWRM4NyLtQf6l_FDyvcYfS5Kos}
spring.ai.openai.chat.model=${GEMINI_MODEL:gemini-flash-lite-latest}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1500

# ============================================================
# H2 - Base de datos en memoria
# ============================================================
spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Server
# ============================================================
server.port=8080
