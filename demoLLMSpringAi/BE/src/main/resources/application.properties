spring.application.name=demoLLMSpringAi

# ============================================================
# GROQ (LLM) - API compatible con OpenAI
# Coloca tu API key reemplazando el placeholder o exportando:
#   $env:GROQ_API_KEY="gsk_tu_key"
# ============================================================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=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
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048

# ============================================================
# H2 - Base de datos en memoria
# ============================================================
spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Server
# ============================================================
server.port=8080
