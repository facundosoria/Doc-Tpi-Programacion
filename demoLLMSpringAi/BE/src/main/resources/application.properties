spring.application.name=demoLLMSpringAi

# ============================================================
# GOOGLE GEMINI (AI Studio) - Compatible con protocolo OpenAI
# ============================================================
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.model=${GEMINI_MODEL:gemini-flash-lite-latest}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=1500

# ============================================================
# BASE DE DATOS (Supabase PostgreSQL / pgvector en la nube)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.wnymwzayqusnoddtpyeg}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Santorito2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Modelo de Embeddings (Google AI Studio - 768 dimensiones)
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# Server
# ============================================================
server.port=8080

# ============================================================
# MULTIPART / SUBIDA DE ARCHIVOS PDF (Permitir hasta 50MB)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
