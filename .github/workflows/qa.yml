name: qa

# El workflow va FLACO a proposito: toda la logica vive en qa.sh y en la imagen.
# Por eso "correr los mismos actions localmente" es literalmente ./qa.sh, sin
# emular nada, y por eso mudarse de GitHub no toca una linea del motor.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, main]

jobs:
  qa:
    # Corre en el runner self-hosted del equipo: no consume minutos de Actions.
    # El repo tiene que seguir siendo privado: un runner self-hosted en un repo
    # publico deja que cualquiera ejecute codigo arbitrario en el server.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          # El gate compara contra el merge-base para bloquear solo lo que este
          # cambio rompio. Sin el historial no hay con que comparar.
          fetch-depth: 0

      # El perfil sale del evento, no de la persona.
      #
      # Cada push tiene que ser barato o el gate deja de ser una red y pasa a ser
      # un embudo: `rapido` son 120s sobre lo que cambiaste. La corrida cara
      # --600s sobre todo el repo-- se paga una sola vez, al abrir el PR, que es
      # donde branch protection decide si entra o no.
      #
      # Un push directo a dev o main tambien va en `completo`: ahi no hay PR que
      # lo cubra, y ademas sobre la propia main el merge-base con origin/main da
      # vacio, asi que `rapido` no mirararia ni un archivo.
      #
      # El nombre de rama entra por env y no interpolado en el shell: un nombre
      # de rama es texto que elige quien pushea, y `${{ }}` dentro de un run: lo
      # ejecutaria.
      - name: Elegir perfil
        id: perfil
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.ref_name }}
        run: |
          if [ "$EVENTO" = "pull_request" ] || [ "$RAMA" = "main" ] || [ "$RAMA" = "dev" ]; then
            echo "args=--all --perfil completo" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      # El alcance del gate SIEMPRE se define aca. Dejarlo librado al fallback de
      # scope.py en los push parecia razonable --"asi ves lo mismo que en tu
      # maquina"-- y era falso: ese fallback compara contra el upstream de la
      # rama, y en el runner el checkout deja el upstream parado exactamente en
      # HEAD. El merge-base daba HEAD, el diff daba vacio, y las nueve etapas que
      # dependen de que archivos cambiaste quedaban en `omitida`. La corrida
      # terminaba en verde sin haber mirado un solo archivo.
      #
      # En tu maquina no se nota porque tu upstream esta atrasado respecto de lo
      # que estas por pushear.
      - name: Elegir la base del alcance
        id: base
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            echo "sha=$BASE_PR" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$ANTES^{commit}" 2>/dev/null; then
            # Lo que trajo este push: los commits que acaban de subir.
            echo "sha=$ANTES" >> "$GITHUB_OUTPUT"
          else
            # Rama nueva --ahi `before` viene en ceros-- o un force-push que dejo
            # ese commit fuera del clon. Se cae a lo mismo que mira un PR.
            echo "sha=$(git merge-base origin/main HEAD || true)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar
        env:
          QA_BASE: ${{ steps.base.outputs.sha }}
        run: ./qa.sh ${{ steps.perfil.outputs.args }}
