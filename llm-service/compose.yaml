services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + la extensión `vector` preinstalada, necesaria desde
    # V14 (EP-09, RAG). Drop-in compatible con postgres:16-alpine para todo lo demás.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llm
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
    volumes:
      - llm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Sin "ports" acá: para conectarse con un cliente SQL o reproducir el escenario de puerto
    # ocupado de H02 (CA4), usar el overlay compose.debug.yaml — no se publica en el compose base
    # (docs/02-arquitectura-y-plataforma/05-servicios-docker.md).

  llm-service:
    build: .
    container_name: llm-service
    expose:
      - "8086"
      - "8087"
    environment:
      SERVER_PORT: "8086"
      MANAGEMENT_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/llm
      SPRING_DATASOURCE_USERNAME: llm
      SPRING_DATASOURCE_PASSWORD: llm
      LLM_CREDENTIALS_MASTER_KEY: ${LLM_CREDENTIALS_MASTER_KEY:?Set a base64-encoded 32-byte AES key before starting llm-service}
      EUREKA_URL: ${EUREKA_URL:-http://eureka:8761/eureka/}
      GATEWAY_URL: ${GATEWAY_URL:-http://api-gateway:8080}
      APP_CLIENT_ID: llm-service
      APP_CLIENT_SECRET: ${APP_CLIENT_SECRET:-}
      # event-bus:29092 es el bus de la plataforma (KAFKA.pdf). Por defecto se usa el broker local "kafka-local"
      # de este compose; si la plataforma está levantada en la red tpi-platform, apuntar a event-bus:29092.
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-kafka-local:29092}
      LLM_KAFKA_ENABLED: ${LLM_KAFKA_ENABLED:-true}
      # The base stack has no Courses mock. These defaults make configuration
      # explicit so Spring can start; deployments must override both values.
      LLM_COURSES_BASE_URL: ${LLM_COURSES_BASE_URL:-http://host.docker.internal:4300}
      LLM_COURSES_SERVICE_TOKEN: ${LLM_COURSES_SERVICE_TOKEN:-local-gateway-m2m-token}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default
      - tpi-platform
    # Sin "ports": en la plataforma real solo el API Gateway expone puertos (ADR-015).
    # Para pegarle desde el host en debug local, usar el overlay compose.debug.yaml.

  # ---------------------------------------------------------------------------------
  # Todavía sin código que los use (sin dependencia en pom.xml, sin cliente instanciado).
  # Quedan preparados y apagados acá para no perder tiempo de config el día que hagan
  # falta. Detalle de cada uno y qué lo activaría: docs/02-arquitectura-y-plataforma/05-servicios-docker.md.
  # ---------------------------------------------------------------------------------

  # redis:
  #   # Cola/caché/cuotas (docs/02-arquitectura-y-plataforma/05-servicios-docker.md). Descartado a
  #   # propósito para S1: "a 120 usuarios probablemente no haga falta Redis" — la cola interna usa
  #   # Postgres SKIP LOCKED. Revisar si el volumen de trabajos crece.
  #   image: redis:7-alpine
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - llm-redis-data:/data

  kafka-local:
    # Broker LOCAL para probar sin la plataforma. El bus real es `event-bus:29092` (KAFKA.pdf) y no lo
    # operamos. Se llama distinto de `event-bus` a propósito: llm-service también está en la red
    # `tpi-platform`, y dos servicios con el mismo nombre en redes distintas harían que DNS devuelva
    # ambos. Mismo puerto interno (29092) que el bus real. KRaft mode, sin Zookeeper.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-local:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-local:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 12

  # minio:
  #   # Almacenamiento de objetos para los PDF originales — "solo si nadie más los
  #   # tiene" (docs/03-capacidades-de-ia/rag-e-ingesta/01-almacenamiento-e-ingesta.md). Hoy el PDF
  #   # se guarda como BYTEA en rag_documents, decisión explícita
  #   # (docs/06-operacion-calidad-y-pruebas/04-estado-de-implementacion/ep-09/ingesta.md, "Qué NO se portó").
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: llm
  #     MINIO_ROOT_PASSWORD: llm12345
  #   volumes:
  #     - llm-minio-data:/data

  # Eureka y API Gateway NO están acá, ni siquiera comentados:
  # docs/06-operacion-calidad-y-pruebas/03-matriz-de-pruebas-de-infraestructura.md registra que "no
  # existe un servidor Eureka/Gateway ejecutable en este repositorio" y que esa suite se
  # prueba "junto con los módulos reales, no como simulación local" — los pone el Tema
  # 01/11. `spring-cloud-starter-netflix-eureka-client` ya está en el pom.xml del lado
  # cliente; EUREKA_URL (.env.example) pasa a apuntar al nombre de red de ese contenedor
  # cuando exista.

volumes:
  # Persiste los datos de Postgres entre `down`/`up` (necesario para H06). Solo se borra con
  # `docker compose down --volumes`.
  llm-postgres-data:
  # llm-redis-data:   # descomentar junto con el servicio `redis` de más arriba
  # llm-minio-data:   # descomentar junto con el servicio `minio` de más arriba

# Redes: llm-default para comunicación interna con PostgreSQL y tpi-platform para integración
# con el stack de plataforma (Eureka, Gateway y otros microservicios del Topic 01).
networks:
  default:
    name: llm-default
  tpi-platform:
    name: tpi-platform
    external: true

