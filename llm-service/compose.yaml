services:
  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + la extensión `vector` preinstalada, necesaria desde
    # V14 (EP-09, RAG). Drop-in compatible con postgres:16-alpine para todo lo demás.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llm
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
    volumes:
      - llm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm -d llm"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Sin "ports" acá: para conectarse con un cliente SQL o reproducir el escenario de puerto
    # ocupado de H02 (CA4), usar el overlay compose.debug.yaml — no se publica en el compose base
    # (docs/02-arquitectura-y-plataforma/05-servicios-docker.md).

  llm-service:
    build: .
    container_name: tpi-llm
    expose:
      - "8086"
      - "8087"
    environment:
      SERVER_PORT: "8086"
      MANAGEMENT_PORT: "8087"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/llm
      SPRING_DATASOURCE_USERNAME: llm
      SPRING_DATASOURCE_PASSWORD: llm
      LLM_CREDENTIALS_MASTER_KEY: ${LLM_CREDENTIALS_MASTER_KEY:?Set a base64-encoded 32-byte AES key before starting llm-service}
      EUREKA_URL: ${EUREKA_URL:-http://eureka:8761/eureka/}
      GATEWAY_URL: ${GATEWAY_URL:-http://api-gateway:8080}
      APP_CLIENT_ID: llm-service
      APP_CLIENT_SECRET: ${APP_CLIENT_SECRET:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LLM_KAFKA_ENABLED: ${LLM_KAFKA_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default
      - tpi-platform
    # Sin "ports": en la plataforma real solo el API Gateway expone puertos (ADR-015).
    # Para pegarle desde el host en debug local, usar el overlay compose.debug.yaml.

  # ---------------------------------------------------------------------------------
  # Todavía sin código que los use (sin dependencia en pom.xml, sin cliente instanciado).
  # Quedan preparados y apagados acá para no perder tiempo de config el día que hagan
  # falta. Detalle de cada uno y qué lo activaría: docs/39-servicios-docker.md.
  # ---------------------------------------------------------------------------------

  # redis:
  #   # Cola/caché/cuotas (docs/12 §3). Descartado a propósito para S1: "a 120 usuarios
  #   # probablemente no haga falta Redis" (docs/06 Parte 2) — la cola interna usa
  #   # Postgres SKIP LOCKED. Revisar si el volumen de trabajos crece.
  #   image: redis:7-alpine
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - llm-redis-data:/data

  kafka:
    # Bus de eventos de la plataforma (Tema 11) — "no lo operamos" en producción real (docs/26
    # Parte 3); un broker local sirve para probar la publicación de `moderation-events`
    # (LLM-EP01-H07) antes de integrar con el broker de cátedra. KRaft mode, sin Zookeeper.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 12

  # minio:
  #   # Almacenamiento de objetos para los PDF originales — "solo si nadie más los
  #   # tiene" (docs/12 §1). Hoy el PDF se guarda como BYTEA en rag_documents, decisión
  #   # explícita (docs/estado-implementacion/ep-09/ingesta.md, "Qué NO se portó").
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: llm
  #     MINIO_ROOT_PASSWORD: llm12345
  #   volumes:
  #     - llm-minio-data:/data

  # Eureka y API Gateway NO están acá, ni siquiera comentados: docs/25 registra que "no
  # existe un servidor Eureka/Gateway ejecutable en este repositorio" y que esa suite se
  # prueba "junto con los módulos reales, no como simulación local" — los pone el Tema
  # 01/11. `spring-cloud-starter-netflix-eureka-client` ya está en el pom.xml del lado
  # cliente; EUREKA_URL (.env.example) pasa a apuntar al nombre de red de ese contenedor
  # cuando exista.

volumes:
  # Persiste los datos de Postgres entre `down`/`up` (necesario para H06). Solo se borra con
  # `docker compose down --volumes`.
  llm-postgres-data:
  # llm-redis-data:   # descomentar junto con el servicio `redis` de más arriba
  # llm-minio-data:   # descomentar junto con el servicio `minio` de más arriba

# Redes: llm-default para comunicación interna con PostgreSQL y tpi-platform para integración
# con el stack de plataforma (Eureka, Gateway y otros microservicios del Topic 01).
networks:
  default:
    name: llm-default
  tpi-platform:
    name: tpi-platform
    external: true

