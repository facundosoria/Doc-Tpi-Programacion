asyncapi: 3.0.0
info:
  title: LLM Service Kafka Events
  version: 3.0.0
  description: >
    Eventos asíncronos de llm-service. Sigue el estándar del PDF KAFKA.pdf de la cátedra, transcrito en
    KAFKA_EVENT_STANDARD.md (ADR-020): envelope común {eventId, eventType, timestamp, producer, payload} SIN
    eventVersion, eventType en MAYÚSCULAS_CON_GUION_BAJO, todo lo emitido en inglés, bus event-bus:29092.

    NOMBRES DE TÓPICO PROVISORIOS. Los grupos no pueden crear tópicos; los nombres de los canales de este archivo
    (practice-events, evaluation-events, moderation-events...) son una propuesta de llm-service a la espera de que
    el grupo de Notificaciones asigne los definitivos (marcados con x-topic-status: pending-assignment).

    La correlación (traceparent / X-Request-Id) viaja como headers del mensaje Kafka, nunca en el payload
    (convención de correlación de la plataforma). Los headers eventId y eventType repiten los del
    envelope para filtrar sin deserializar. No hay header eventVersion.

    v3.0.0 reemplaza el envelope de v2 (que agregaba eventVersion) y los eventType con guiones — breaking change
    documentado, ver "Historial de versiones" al pie.
servers:
  eventBus:
    host: event-bus:29092
    protocol: kafka
    description: >
      Bus de la plataforma. Variable de entorno KAFKA_BOOTSTRAP (default event-bus:29092). group-id = nombre del
      servicio (llm-service).
channels:
  practice-events:
    address: practice-events
    x-topic-status: pending-assignment
    description: >
      Dominio de practice-service (Tema 05). Consumido por llm-service. Message Key: definida por el productor
      (Tema 05) — Pendiente de documentar acá hasta que confirmen su estrategia.
    messages:
      attemptClosed: { $ref: '#/components/messages/AttemptClosed' }
  course-events:
    address: course-events
    x-topic-status: pending-assignment
    description: "Dominio de cursos. Consumido por llm-service. Message Key: definida por el productor — Pendiente."
    messages:
      courseArchived: { $ref: '#/components/messages/CourseArchived' }
  llm-config-events:
    address: llm-config-events
    x-topic-status: pending-assignment
    description: "Dominio de configuración de proveedores LLM. Consumido por llm-service. Message Key: Pendiente."
    messages:
      modelChanged: { $ref: '#/components/messages/ModelChanged' }
  evaluation-events:
    address: evaluation-events
    x-topic-status: pending-assignment
    description: >
      Dominio de evaluación automática, publicado por llm-service. Message Key: `courseCohortId`
      (preserva el orden de los scores dentro de una misma cohorte/curso). El tópico mezcla dos eventType con
      payloads distintos: un consumidor tipado por payload no alcanza, hay que ramificar por eventType.
    messages:
      scoreCalculated: { $ref: '#/components/messages/ScoreResult' }
      scoreDeferred: { $ref: '#/components/messages/DeferredScore' }
  calibration-events:
    address: calibration-events
    x-topic-status: pending-assignment
    description: >
      Dominio de calibración de rúbricas, publicado por llm-service. Message Key: `rubricVersionId`
      (preserva el orden de resultados de calibración de una misma versión de rúbrica).
    messages:
      calibrationApproved: { $ref: '#/components/messages/CalibrationResult' }
      calibrationOutOfTolerance: { $ref: '#/components/messages/CalibrationResult' }
  moderation-events:
    address: moderation-events
    x-topic-status: pending-assignment
    description: >
      Dominio de moderación de chat, publicado por llm-service (LLM-EP01-H07, LLM-S12-H02).
      Message Key: `courseId` (preserva el orden relativo de incidentes/resoluciones de un mismo
      curso). Productor real: ModerationEventPublisher, vía outbox transaccional (event_outbox) +
      EventOutboxRelay.
    messages:
      jailbreakIncidentDetected: { $ref: '#/components/messages/JailbreakIncident' }
      messageUnblocked: { $ref: '#/components/messages/MessageUnblocked' }
operations:
  consumeAttemptClosed: { action: receive, channel: { $ref: '#/channels/practice-events' } }
  consumeCourseArchived: { action: receive, channel: { $ref: '#/channels/course-events' } }
  consumeModelChanged: { action: receive, channel: { $ref: '#/channels/llm-config-events' } }
  publishScoreCalculated: { action: send, channel: { $ref: '#/channels/evaluation-events' } }
  publishScoreDeferred: { action: send, channel: { $ref: '#/channels/evaluation-events' } }
  publishCalibrationApproved: { action: send, channel: { $ref: '#/channels/calibration-events' } }
  publishCalibrationOutOfTolerance: { action: send, channel: { $ref: '#/channels/calibration-events' } }
  publishJailbreakIncident: { action: send, channel: { $ref: '#/channels/moderation-events' } }
  publishMessageUnblocked: { action: send, channel: { $ref: '#/channels/moderation-events' } }
components:
  messages:
    AttemptClosed:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/AttemptClosedEvent' }
    CourseArchived:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/CourseArchivedEvent' }
    ModelChanged:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/ModelChangedEvent' }
    ScoreResult:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/ScoreCalculatedEvent' }
    DeferredScore:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/ScoreDeferredEvent' }
    CalibrationResult:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/CalibrationResultEvent' }
    JailbreakIncident:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/JailbreakIncidentEvent' }
    MessageUnblocked:
      headers: { $ref: '#/components/schemas/MessageHeaders' }
      payload: { $ref: '#/components/schemas/MessageUnblockedEvent' }
  schemas:
    MessageHeaders:
      type: object
      description: >
        Headers del mensaje Kafka (no forman parte del envelope JSON). La correlación nunca va en el payload.
        No existe el header eventVersion.
      properties:
        eventId: { type: string, format: uuid, description: "Repite envelope.eventId." }
        eventType: { type: string, description: "Repite envelope.eventType." }
        traceparent: { type: string, description: "W3C trace context, si hay." }
        X-Request-Id: { type: string, description: "Id de correlación, si hay." }
    Envelope:
      type: object
      description: >
        Envelope común de plataforma (KAFKA_EVENT_STANDARD.md §2, del PDF KAFKA.pdf). Son exactamente estos cinco
        campos, todos obligatorios. No renombrar, quitar ni agregar campos.
      required: [eventId, eventType, timestamp, producer, payload]
      additionalProperties: false
      properties:
        eventId: { type: string, format: uuid, description: "UUID único de esta instancia del evento." }
        eventType:
          type: string
          description: "Hecho del dominio ya ocurrido, MAYÚSCULAS_CON_GUION_BAJO, p.ej. MESSAGE_UNBLOCKED (§3)."
        timestamp: { type: string, format: date-time, description: "Momento en que ocurrió, ISO-8601 en UTC." }
        producer:
          type: string
          description: >
            Microservicio que produjo el evento. Hoy `llm-service` (spring.application.name). Valor a confirmar con
            Notificaciones (el PDF usa `challenges-service` como ejemplo y `tema-XX-service-name` como plantilla).
        payload: { type: object, description: "Datos específicos del eventType (§2)." }
    AttemptClosedEvent:
      description: >
        PROVISORIO — contrato de entrada aún en convergencia con Tema 05 (productor). llm-service solo lee los
        campos listados; los desconocidos se ignoran.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: ATTEMPT_CLOSED }
            payload:
              type: object
              required: [attemptId, courseCohortId, learnerId, transcript]
              properties:
                attemptId: { type: string, format: uuid }
                courseCohortId: { type: string, format: uuid }
                learnerId: { type: string, format: uuid }
                transcript: { type: array, items: { type: object } }
    CourseArchivedEvent:
      description: "PROPUESTO, no implementado todavía. Evento de otro equipo (courses); el payload lo define el productor."
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: COURSE_ARCHIVED }
    ModelChangedEvent:
      description: "PROPUESTO, no implementado todavía. Evento de configuración de proveedores LLM; payload pendiente."
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: MODEL_CHANGED }
    ScoreCalculatedEvent:
      description: >
        PROVISORIO — propuesta de llm-service, todavía sin validar con Tema 05 (consumidor).
        Implementado en AttemptEvaluationService; el campo `score` lo calcula el código con los pesos
        fijos de la rúbrica, no el modelo (RF-IA-15).
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: SCORE_CALCULATED }
            payload:
              type: object
              required: [attemptId, courseCohortId, learnerId, rubricVersionId, score, dimensions, evaluator]
              properties:
                attemptId: { type: string, format: uuid }
                courseCohortId: { type: string, format: uuid }
                learnerId: { type: string, format: uuid }
                rubricVersionId: { type: string, format: uuid }
                score: { type: integer, minimum: 0, maximum: 100, description: "Agregado ponderado, redondeado." }
                dimensions:
                  type: object
                  required: [autonomy, clarity, progression, compliance, efficiency]
                  additionalProperties: false
                  properties:
                    autonomy: { type: integer, minimum: 0, maximum: 100 }
                    clarity: { type: integer, minimum: 0, maximum: 100 }
                    progression: { type: integer, minimum: 0, maximum: 100 }
                    compliance: { type: integer, minimum: 0, maximum: 100 }
                    efficiency: { type: integer, minimum: 0, maximum: 100 }
                evaluator:
                  type: object
                  required: [provider, model]
                  properties:
                    provider: { type: string, description: "`fake` en modo test." }
                    model: { type: string, description: "`fake-evaluator-v1` en modo test." }
    ScoreDeferredEvent:
      description: >
        PROVISORIO — propuesta de llm-service, todavía sin validar con Tema 05. Se publica cuando el
        intento no se pudo evaluar ahora; `retryFrom` es un instante ISO-8601 sugerido para reintentar.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: SCORE_DEFERRED }
            payload:
              type: object
              required: [attemptId, courseCohortId, learnerId, reason, retryFrom]
              properties:
                attemptId: { type: string, format: uuid }
                courseCohortId: { type: string, format: uuid }
                learnerId: { type: string, format: uuid }
                reason: { type: string, enum: [MODEL_UNAVAILABLE, INVALID_MODEL_RESPONSE, RUBRIC_UNAVAILABLE] }
                retryFrom: { type: string, format: date-time }
    CalibrationResultEvent:
      description: "PROPUESTO, no implementado todavía. Payload pendiente de definir."
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { type: string, enum: [CALIBRATION_APPROVED, CALIBRATION_OUT_OF_TOLERANCE] }
    JailbreakIncidentEvent:
      description: "PROPUESTO, no implementado todavía. Payload pendiente de definir."
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: JAILBREAK_INCIDENT_DETECTED }
    MessageUnblockedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: MESSAGE_UNBLOCKED }
            payload:
              type: object
              required: [messageId, incidentId, courseId, userId, resolvedBy, resolution]
              properties:
                messageId: { type: string }
                incidentId: { type: string, format: uuid }
                courseId: { type: string }
                userId: { type: string }
                resolvedBy: { type: string }
                resolution: { type: string, const: REVERSED }
                resolutionReason: { type: string }

# # Historial de versiones
#
# - **v3.0.0 (2026-09-20):** migración al estándar del PDF `KAFKA.pdf` (ADR-020, KAFKA_EVENT_STANDARD.md).
#   Envelope de cinco campos `{eventId, eventType, timestamp, producer, payload}`: se quita `eventVersion`
#   (del body y del header). `eventType` pasa de MAYÚSCULAS-CON-GUIONES a MAYÚSCULAS_CON_GUION_BAJO
#   (`ATTEMPT-CLOSED` → `ATTEMPT_CLOSED`, `SCORE-CALCULATED` → `SCORE_CALCULATED`, `SCORE-DEFERRED` →
#   `SCORE_DEFERRED`, `MESSAGE-UNBLOCKED` → `MESSAGE_UNBLOCKED`). Bus `event-bus:29092` (antes `kafka:9092`).
#   Nombres de tópico marcados como provisorios (`x-topic-status: pending-assignment`): los asigna
#   Notificaciones. Sin tópico `.dlt`: los mensajes rechazados quedan en la tabla `event_dead_letter`.
#   Breaking change respecto de v2 — cualquier consumidor que ya integró v2 debe migrar.
# - **v2.0.0 (2026-09-18):** envelope `{eventId, eventType, eventVersion, timestamp, producer, payload}`,
#   topics por dominio, eventType con guiones (era el adjunto de `llm-service-kafka-contract` v4 en el
#   Skill Hub). Retirado de docs/contracts/ el 2026-09-22; ver registro/2026-09-20-estandar-kafka-del-pdf.md.
# - **v1.0.0:** envelope `{eventId, version, occurredAt, producer, data}`, un topic por eventType
#   (`intento_cerrado.v1`, `score_de_ia_calculado.v1`, etc.). Retirado de docs/contracts/ el 2026-09-22.
