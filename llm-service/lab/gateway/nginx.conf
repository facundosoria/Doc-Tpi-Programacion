events { worker_connections 1024; }

http {
    # Docker DNS registers service names asynchronously. Resolve upstreams at
    # request time so the gateway can start before a dependent container has
    # published its DNS record, and recover if it is recreated later.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # The browser may provide correlation headers, but never an identity. If it
    # does not provide them, create development-safe values at the edge.
    map $http_x_request_id $correlation_id {
        ""      $request_id;
        default $http_x_request_id;
    }
    map $http_traceparent $trace_context {
        ""      "00-$request_id-0000000000000001-01";
        default $http_traceparent;
    }

    server {
        listen 8080;

        # This is a gateway simulator, not a replacement for application
        # authorization. It deliberately overwrites browser-supplied identity.
        location /api/llm/ {
            set $llm_upstream llm-service:8086;   # SERVER_PORT del servicio (application.yml / compose.yaml)
            # With a variable upstream, explicitly preserve the complete
            # original URI; otherwise Nginx drops the suffix after /api/llm/.
            proxy_pass http://$llm_upstream$request_uri;
            # GatewayIdentityFilter solo autentica con X-Principal-Type; el Gateway real lo inyecta, el cliente nunca.
            proxy_set_header X-Principal-Type "service";
            proxy_set_header X-Service-Id "admin-service";
            proxy_set_header X-Service-Scopes "llm.golden-set.manage llm.rubric-template.manage llm.calibration.manage llm.model-assignment.manage llm.evaluation.override";
            proxy_set_header X-Delegated-User "11111111-1111-1111-1111-111111111111";
            proxy_set_header X-Request-Id $correlation_id;
            proxy_set_header traceparent $trace_context;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Courses remains outside Tema 07. Browser course context and the
        # service-to-service membership lookup both traverse this same edge.
        location /api/courses/ {
            set $courses_upstream courses-mock:1080;
            proxy_pass http://$courses_upstream$request_uri;
            proxy_set_header X-Request-Id $correlation_id;
            proxy_set_header traceparent $trace_context;
            proxy_set_header Host $host;
        }
    }
}
