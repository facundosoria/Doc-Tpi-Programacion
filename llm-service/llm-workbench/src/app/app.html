<header class="topbar">
  <a routerLink="/docente" class="brand" aria-label="TUP-Golde-Set, inicio">
    <span class="brand-mark" aria-hidden="true">GS</span>
    <span><b>TUP</b><strong>Golde-Set</strong></span>
  </a>
  @if (currentCourse(); as course) {
    <span class="workspace-label"><strong>{{ course.name }}</strong><small>{{ course.subtitle }}</small></span>
  } @else {
    <span class="workspace-label">Panel docente · Evaluador pedagógico</span>
  }
  <nav aria-label="Navegación principal">
    <a routerLink="/docente">Mis cursos</a>
  </nav>
  <span class="profile"><span aria-hidden="true">●</span> Docente</span>
</header>
<main><router-outlet /></main>
