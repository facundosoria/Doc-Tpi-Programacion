asyncapi: 3.0.0
info:
  title: LLM Service Kafka Events
  version: 2.0.0
  description: >
    Eventos asíncronos de llm-service. Sigue el estándar de plataforma KAFKA_EVENT_STANDARD.md:
    envelope común {eventId, eventType, eventVersion, timestamp, producer, payload}, topics
    organizados por dominio (no uno por eventType), eventType en MAYÚSCULAS-CON-GUIONES.
    La correlación (traceparent / X-Request-Id) viaja como headers del mensaje Kafka, nunca en el
    payload (.skill-hub/request-correlation-across-http-and-kafka.md).

    v2.0.0 reemplaza el envelope de v1 (eventId/version/occurredAt/producer/data) y la estrategia
    de un topic por eventType — breaking change documentado, ver "Historial de versiones" al pie.
servers:
  platformKafka:
    host: kafka:9092
    protocol: kafka
channels:
  practice-events:
    address: practice-events
    description: >
      Dominio de practice-service (Tema 05). Consumido por llm-service. Message Key: definida por
      el productor (Tema 05) — Pendiente de documentar acá hasta que confirmen su estrategia.
    messages:
      attemptClosed: { $ref: '#/components/messages/AttemptClosed' }
  course-events:
    address: course-events
    description: Dominio de cursos. Consumido por llm-service. Message Key: definida por el productor — Pendiente.
    messages:
      courseArchived: { $ref: '#/components/messages/CourseArchived' }
  llm-config-events:
    address: llm-config-events
    description: Dominio de configuración de proveedores LLM. Consumido por llm-service. Message Key: Pendiente.
    messages:
      modelChanged: { $ref: '#/components/messages/ModelChanged' }
  evaluation-events:
    address: evaluation-events
    description: >
      Dominio de evaluación automática, publicado por llm-service. Message Key: `courseCohortId`
      (preserva el orden de los scores dentro de una misma cohorte/curso).
    messages:
      scoreCalculated: { $ref: '#/components/messages/ScoreResult' }
      scoreDeferred: { $ref: '#/components/messages/DeferredScore' }
  calibration-events:
    address: calibration-events
    description: >
      Dominio de calibración de rúbricas, publicado por llm-service. Message Key: `rubricVersionId`
      (preserva el orden de resultados de calibración de una misma versión de rúbrica).
    messages:
      calibrationApproved: { $ref: '#/components/messages/CalibrationResult' }
      calibrationOutOfTolerance: { $ref: '#/components/messages/CalibrationResult' }
  moderation-events:
    address: moderation-events
    description: >
      Dominio de moderación de chat, publicado por llm-service (LLM-EP01-H07, LLM-S12-H02).
      Message Key: `courseId` (preserva el orden relativo de incidentes/resoluciones de un mismo
      curso — ver KAFKA_EVENT_STANDARD.md §14). Productor real: ModerationEventPublisher, vía
      outbox transaccional (event_outbox) + EventOutboxRelay.
    messages:
      jailbreakIncidentDetected: { $ref: '#/components/messages/JailbreakIncident' }
      messageUnblocked: { $ref: '#/components/messages/MessageUnblocked' }
operations:
  consumeAttemptClosed: { action: receive, channel: { $ref: '#/channels/practice-events' } }
  consumeCourseArchived: { action: receive, channel: { $ref: '#/channels/course-events' } }
  consumeModelChanged: { action: receive, channel: { $ref: '#/channels/llm-config-events' } }
  publishScoreCalculated: { action: send, channel: { $ref: '#/channels/evaluation-events' } }
  publishScoreDeferred: { action: send, channel: { $ref: '#/channels/evaluation-events' } }
  publishCalibrationApproved: { action: send, channel: { $ref: '#/channels/calibration-events' } }
  publishCalibrationOutOfTolerance: { action: send, channel: { $ref: '#/channels/calibration-events' } }
  publishJailbreakIncident: { action: send, channel: { $ref: '#/channels/moderation-events' } }
  publishMessageUnblocked: { action: send, channel: { $ref: '#/channels/moderation-events' } }
components:
  messages:
    AttemptClosed:
      payload: { $ref: '#/components/schemas/AttemptClosedEvent' }
    CourseArchived:
      payload: { $ref: '#/components/schemas/Envelope' }
    ModelChanged:
      payload: { $ref: '#/components/schemas/Envelope' }
    ScoreResult:
      payload: { $ref: '#/components/schemas/Envelope' }
    DeferredScore:
      payload: { $ref: '#/components/schemas/Envelope' }
    CalibrationResult:
      payload: { $ref: '#/components/schemas/Envelope' }
    JailbreakIncident:
      payload: { $ref: '#/components/schemas/Envelope' }
    MessageUnblocked:
      payload: { $ref: '#/components/schemas/MessageUnblockedEvent' }
  schemas:
    Envelope:
      type: object
      description: Envelope común de plataforma (KAFKA_EVENT_STANDARD.md §5). No renombrar/eliminar estos campos.
      required: [eventId, eventType, eventVersion, timestamp, producer, payload]
      properties:
        eventId: { type: string, format: uuid, description: "UUID único de esta instancia del evento (§6)." }
        eventType: { type: string, description: "Hecho del dominio, MAYÚSCULAS-CON-GUIONES, p.ej. MESSAGE-UNBLOCKED (§7)." }
        eventVersion: { type: integer, minimum: 1, description: "Versión del contrato de este eventType, empieza en 1 (§8)." }
        timestamp: { type: string, format: date-time, description: "ISO 8601 UTC (§9)." }
        producer: { type: string, description: "Identificador del microservicio productor (§10)." }
        payload: { type: object, description: "Datos específicos del eventType/eventVersion (§11)." }
    AttemptClosedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            payload:
              type: object
              required: [attemptId, courseCohortId, learnerId, transcript]
              properties:
                attemptId: { type: string, format: uuid }
                courseCohortId: { type: string, format: uuid }
                learnerId: { type: string, format: uuid }
                transcript: { type: array, items: { type: object } }
    MessageUnblockedEvent:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            eventType: { const: MESSAGE-UNBLOCKED }
            payload:
              type: object
              required: [messageId, incidentId, courseId, userId, resolvedBy, resolution]
              properties:
                messageId: { type: string }
                incidentId: { type: string, format: uuid }
                courseId: { type: string }
                userId: { type: string }
                resolvedBy: { type: string }
                resolution: { type: string, const: REVERSED }
                resolutionReason: { type: string }
---
# Historial de versiones

- **v2.0.0 (2026-09-18):** migración al estándar de plataforma `KAFKA_EVENT_STANDARD.md`
  (envelope `{eventId, eventType, eventVersion, timestamp, producer, payload}`, topics por
  dominio en lugar de uno por evento). Breaking change de contrato respecto de v1 — cualquier
  consumidor externo que ya integró v1 debe migrar. Agrega `MESSAGE-UNBLOCKED` en
  `moderation-events`, antes solo documentado como `mensaje_desbloqueado.v1` sin AsyncAPI formal.
- **v1.0.0:** envelope `{eventId, version, occurredAt, producer, data}`, un topic por eventType
  (`intento_cerrado.v1`, `score_de_ia_calculado.v1`, etc.). Preservado en
  `docsV2/contracts/historicos-y-contratos-v1/llm-service-v1.asyncapi.yaml`.
